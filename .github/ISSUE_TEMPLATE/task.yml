name: Task
description: A piece of work — a feature, a refactor, a doc
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What and why
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: >
        A sketch of how, and what it depends on. If docs/notes/ already covers
        the background, link the note.

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we will know it works — the tests or the check to run.
