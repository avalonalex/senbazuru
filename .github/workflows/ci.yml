# Runs the same gates as `make check`, split into jobs so a formatting failure
# does not hide a test failure.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Provides the GHC that stack.yaml's `system-ghc: true` expects. Keep the
      # version in step with the snapshot in stack.yaml (lts-22.44 => 9.6.7).
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          enable-stack: true
          stack-version: 'latest'

      # Building aeson from source on every run takes minutes; the snapshot only
      # changes when stack.yaml does, so key the cache on it.
      - uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'senbazuru.cabal') }}
          restore-keys: ${{ runner.os }}-stack-

      - run: stack build --test --no-run-tests
      - run: stack test

  format:
    name: ormolu
    runs-on: ubuntu-latest
    env:
      # Must match the ormolu that `make fmt` runs locally -- check with
      # `ormolu --version`. Ormolu's output changes between releases, so an
      # unpinned formatter fails CI on a day nobody touched the code.
      ORMOLU_VERSION: 0.7.2.0
      # Ormolu renamed its release assets at 0.8.0.0: "ormolu-Linux.zip" became
      # "ormolu-x86_64-linux.zip". Bump this alongside ORMOLU_VERSION.
      ORMOLU_ASSET: ormolu-Linux.zip
    steps:
      - uses: actions/checkout@v5

      # Downloaded directly rather than via haskell-actions/run-ormolu, which
      # only knows the post-0.8.0.0 asset naming and so cannot fetch a pinned
      # older version at all. Five lines of curl is a fair trade for being able
      # to pin any version we like.
      - name: Install pinned ormolu
        run: |
          curl -sSfL -o /tmp/ormolu.zip \
            "https://github.com/tweag/ormolu/releases/download/${ORMOLU_VERSION}/${ORMOLU_ASSET}"
          unzip -q /tmp/ormolu.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/ormolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Same file set as the Makefile's fmt-check target. Ormolu picks up
      # default-extensions from senbazuru.cabal on its own.
      - name: Check formatting
        run: |
          ormolu --version
          ormolu --mode check $(find src app test -name '*.hs')

  lint:
    name: hlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/hlint-setup@v2
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "app/", "test/"]'
          fail-on: warning
